services:
  python-template-server:
    image: ${IMAGE:-ghcr.io/javidahmed64592/python-template-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-template-server
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
    volumes:
      - ./.env:/app/.env
      - logs:/app/logs
    restart: unless-stopped

volumes:
  logs:
